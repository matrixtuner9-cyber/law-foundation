  for(const e of EL){const fi=e.fi??.5,fo=e.fo??.4;

    e.d.style.opacity=o; e.d.style.transform=`translate(${v('x',0)}px,${v('y',0)}px) scale(${v('s',1)}) rotate(${v('r',0)}deg)`;
    if(e.on) e.on(t,e.d);
  }
  const P=document.querySelector('.prog i'); if(P) P.style.width=(100*clamp(t/window.DUR))+'%';
