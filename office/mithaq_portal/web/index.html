<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="بوابة الموكل - مكتب الميثاق للمحاماة">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ميثاق">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>بوابة ميثاق</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B1B2B">
  <script>
  // إشعارات بوابة الموكل (Web Push): يتصل به تطبيق Flutter عبر mqPush
  window.mqPush = (function () {
    var ok = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
    var reg = null;
    function key(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); var r = atob(s + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(r, function (c) { return c.charCodeAt(0); }); }
    function code() { try { var v = localStorage.getItem('flutter.code'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    async function subscribe(c) {
      var k = await (await fetch('/api/portal/push-key')).json();
      if (!k.enabled) return 'server';
      reg = reg || await navigator.serviceWorker.ready;
      var s = await reg.pushManager.getSubscription();
      if (!s) s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key(k.key) });
      var r = await fetch('/api/portal/push-subscribe', { method: 'POST', headers: { 'content-type': 'application/json', 'x-client': c }, body: JSON.stringify(s) });
      return r.ok ? 'granted' : 'error';
    }
    if (ok) navigator.serviceWorker.register('push-sw.js').then(function (r) {
      reg = r;
      var c = code();
      if (c && Notification.permission === 'granted') subscribe(c).catch(function () {});
    }).catch(function () {});
    return {
      status: function () { return ok ? Notification.permission : 'unsupported'; },
      enable: async function (c) {
        if (!ok) return 'unsupported';
        try { var p = await Notification.requestPermission(); return p === 'granted' ? await subscribe(c) : p; }
        catch (e) { return 'error'; }
      }
    };
  })();
  window.addEventListener('flutter-first-frame', function () { var s = document.getElementById('mq-splash'); if (s) s.remove(); });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
