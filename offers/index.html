<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عروض المِسْبار</title>
<style>
:root{--navy:#13233f;--navy2:#1c3157;--gold:#e8c77a;--gold2:#d9b25c;--cream:#f4efe4;--card:#fbf8f1;--line:#e6d7b6;--ink:#1d2433;--mute:#7b7465;--ok:#2f8f5b;--warn:#b7791f;--bad:#b4442f;--wa:#25a35a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font:15px/1.6 "Segoe UI","Tahoma","Noto Sans Arabic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:3px solid var(--gold2)}
.logo{width:46px;height:46px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:24px;font-weight:700}
.ttl h1{margin:0;font-size:26px;color:var(--gold);line-height:1.2}
.ttl p{margin:0;font-size:13px;color:#d6dbe6}
.tabs{margin-inline-start:auto;display:flex;gap:6px;background:rgba(255,255,255,.08);padding:5px;border-radius:12px}
.tabs button{border:0;background:transparent;color:#e9edf5;padding:7px 16px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--navy);font-weight:700}
.today{font-size:13px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:999px;white-space:nowrap}
.today.over{background:#7a2a1d}
main{padding:16px 18px;height:calc(100% - 76px);overflow:auto}
.grid3{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr) minmax(330px,1.15fr);gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:200px}
.panel h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.panel h2 .n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{border:1px solid var(--line);background:#fff;padding:5px 13px;border-radius:999px;cursor:pointer;font-size:14px}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 auto}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);flex:0 0 auto;cursor:pointer}
.list{margin-top:8px;max-height:30vh;overflow:auto;border-top:1px dashed var(--line)}
.it{padding:8px 6px;border-bottom:1px solid #efe6d2;cursor:pointer;border-radius:8px}
.it:hover{background:#f6efdf}.it.on{background:#efe3c4}
.it b{display:block;font-size:15px}
.it small{color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;background:#eee4cd;color:#5b5240;margin-inline-start:4px}
.tag.sent{background:#e0ecf8;color:#24507e}.tag.int{background:#def1e4;color:#226b43}.tag.no{background:#f6e0da;color:#8a3324}.tag.due{background:#fbe9c8;color:#8a5a12}
.muted{color:var(--mute);font-size:13px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-top:10px}
.card h3{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:#fffdf8;cursor:pointer}
.chip.on{border-color:var(--wa);background:#eaf7ef}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;max-height:52vh;overflow:auto}
.tp{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer;min-height:70px;position:relative}
.tp.on{outline:2px solid var(--navy)}
.tp b{display:block;font-size:15px}.tp small{color:var(--mute)}
.tp .ed{position:absolute;top:6px;left:8px;border:0;background:transparent;cursor:pointer;color:var(--mute);font-size:13px}
textarea.msg{width:100%;min-height:330px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;resize:vertical;line-height:1.9}
.to{border:1px dashed var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px;background:#fffdf7}
.warn{color:var(--bad);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn:hover{background:#f6efdf}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa);font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold2);color:var(--navy);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.qbar{display:flex;align-items:center;gap:8px;background:#13233f;color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:12px}
.qbar b{color:var(--gold)}
.qbar .btn{padding:4px 12px;color:var(--ink)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:7px 10px;border-bottom:1px solid #efe6d2;text-align:start;font-size:14px;vertical-align:top}
th{background:#f3ead5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.kpi b{display:block;font-size:24px;color:var(--navy)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(10,18,35,.45);display:grid;place-items:center;z-index:9}
.modal .box{background:var(--card);border-radius:16px;padding:18px;width:min(760px,94vw);max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:999px;z-index:10;font-size:14px}
.hist{max-height:160px;overflow:auto;font-size:13px;margin-top:6px}
.hist div{border-bottom:1px dotted var(--line);padding:3px 0}
.media{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.th{position:relative;width:86px;height:64px;border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{border-color:var(--wa);box-shadow:0 0 0 2px #bfe8cf}
.th .k{position:absolute;top:3px;right:3px;background:var(--wa);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:grid;place-items:center}
.th .x{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;font-size:11px;cursor:pointer;padding:0 5px}
.th.add{display:grid;place-items:center;color:var(--mute);font-size:13px;border-style:dashed}
.hint{background:#eaf7ef;border:1px solid #bfe8cf;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
@media (max-width:1100px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">⚖</div>
  <div class="ttl"><h1>عروض المِسْبار</h1><p>التعريف بالتطبيق لدى المحامين: دليل النقابة، قوالب جاهزة، وسجل لكل محامٍ</p></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="today" id="today"></div>
</header>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
